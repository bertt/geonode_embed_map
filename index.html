<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GeoNode map embedded in a website</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0 auto; max-width: 960px; padding: 1rem; }
    iframe { width: 100%; height: 600px; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h1>GeoNode map embedded in a website</h1>
  <p>
    Example map from the public GeoNode demo instance
    (<a href="https://stable.demo.geonode.org/catalogue/#/map/19196">open in GeoNode</a>).
  </p>

  <!-- Replace the host and map ID with your own: https://YOUR-GEONODE/maps/<ID>/embed -->
  <iframe
    src="https://stable.demo.geonode.org/maps/19196/embed"
    title="GeoNode map"
    loading="lazy"
    allowfullscreen>
  </iframe>

  <p>See also the custom MapLibre map with click popups (option 2): <a href="maplibre-popup.html">maplibre-popup.html</a>.</p>
</body>
</html>

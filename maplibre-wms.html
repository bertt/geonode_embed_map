<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GeoNode WMS layer in MapLibre GL JS</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <style>
    body { font-family: system-ui, sans-serif; margin: 0 auto; max-width: 960px; padding: 1rem; }
    #map { height: 600px; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h1>GeoNode WMS layer in MapLibre GL JS</h1>
  <p>
    The layer of GeoNode map
    <a href="https://stable.demo.geonode.org/catalogue/#/map/19196">Entidades_PVCV</a>
    as a WMS raster source on an OpenStreetMap basemap.
  </p>
  <div id="map"></div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script>
    // Replace with your own GeoNode host and layer name (workspace:name)
    const GEONODE = 'https://stable.demo.geonode.org';
    const LAYER = 'geonode:entidades_pvcv_91ebc7d3f40b8ea135609353edfbf2c5';
    // Layer extent as [[west, south], [east, north]] (see ll_bbox_polygon in /api/v2/maps/<ID>)
    const BOUNDS = [[-0.945, 37.986], [0.474, 40.504]];

    const map = new maplibregl.Map({
      container: 'map',
      bounds: BOUNDS,
      fitBoundsOptions: { padding: 20 },
      style: {
        version: 8,
        sources: {
          osm: {
            type: 'raster',
            tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
            tileSize: 256,
            attribution: '&copy; OpenStreetMap contributors'
          },
          geonode: {
            type: 'raster',
            tileSize: 256,
            tiles: [
              `${GEONODE}/geoserver/ows?service=WMS&version=1.1.1&request=GetMap` +
              `&layers=${LAYER}&styles=&format=image/png&transparent=true` +
              `&srs=EPSG:3857&width=256&height=256&bbox={bbox-epsg-3857}`
            ]
          }
        },
        layers: [
          { id: 'osm', type: 'raster', source: 'osm' },
          { id: 'geonode', type: 'raster', source: 'geonode' }
        ]
      }
    });
    map.addControl(new maplibregl.NavigationControl());
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GeoNode layers in a custom Leaflet map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    body { font-family: system-ui, sans-serif; margin: 0 auto; max-width: 960px; padding: 1rem; }
    #map { height: 600px; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h1>GeoNode layers in a custom Leaflet map</h1>
  <p>
    The layer of GeoNode map
    <a href="https://stable.demo.geonode.org/catalogue/#/map/19196">Entidades_PVCV</a>
    (public demo instance), shown as a WMS layer on an OpenStreetMap basemap.
  </p>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Replace with your own GeoNode host and layer name (workspace:name)
    const GEONODE = 'https://stable.demo.geonode.org';
    const LAYER = 'geonode:entidades_pvcv_91ebc7d3f40b8ea135609353edfbf2c5';
    // Layer extent as [[south, west], [north, east]] (see ll_bbox_polygon in /api/v2/maps/<ID>)
    const BOUNDS = [[37.986, -0.945], [40.504, 0.474]];
    const OWS = `${GEONODE}/geoserver/ows`;

    const map = L.map('map').fitBounds(BOUNDS);
    const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const wms = L.tileLayer.wms(OWS, {
      layers: LAYER, format: 'image/png', transparent: true
    }).addTo(map);

    L.control.layers({ OpenStreetMap: osm }, { 'WMS layer': wms }).addTo(map);
  </script>
</body>
</html>
